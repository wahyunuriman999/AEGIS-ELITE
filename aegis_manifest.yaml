name: AEGIS Elite
version: 14.0.0
tier: elite
description: >
  AEGIS Elite — Enterprise Cognitive Runtime Platform.
  The full AI Engineering Operating System, built on top of AEGIS-Core.
  Every feature in Core is present here. Elite adds orchestration, governance,
  multi-agent consensus, memory, benchmarking, and the full decision pipeline.

relationship:
  built_on: AEGIS-Core
  positioning: >
    AEGIS-Core is the kernel. AEGIS-Elite is the full operating system.
    Core = Linux kernel. Elite = Ubuntu/Fedora — a complete OS built on that kernel.
    Target: Enterprise teams that need governance, auditability, workflow, and scalability.

# ─────────────────────────────────────────────────────
#  Core Engines (inherited superset from AEGIS-Core)
# ─────────────────────────────────────────────────────
core:
  kernel:
    module: AEGIS-Kernel
    entry: registry.py
    description: Capability Graph, SSOT engine registry, lifecycle management
    capabilities: [register, boot, health, metrics, policy]
    status: active

  compiler:
    module: AEGIS-Compiler
    entry: pipeline.py
    description: 5-stage compile pipeline — Parse → Validate → Build → Test → Deploy
    capabilities: [parse, validate, build, test, deploy]
    status: active

  runtime:
    module: AEGIS-Runtime
    entry: dispatcher.py
    description: Control plane — event loop, task dispatcher, scheduler
    capabilities: [dispatch, schedule, route, trace]
    status: active

  orchestrator:
    module: AEGIS-Orchestrator
    entry: model_router.py
    description: Active model router — selects optimal LLM per task
    capabilities: [route, classify, score_complexity, select_provider]
    status: active
    providers:
      - {id: claude-sonnet,   use_case: code_generation, complexity: [complex, critical]}
      - {id: gpt-4o,          use_case: architecture,    complexity: [complex, critical]}
      - {id: gemini-flash,    use_case: quick_tasks,     complexity: [trivial, low]}
      - {id: ollama-local,    use_case: private_data,    complexity: [any]}

  sdk:
    module: AEGIS-SDK
    entry: sdk.py
    description: Enforced SDK contract — the only sanctioned integration layer
    capabilities: [import_guard, capability_resolve, contract_validate]
    status: active

# ─────────────────────────────────────────────────────
#  Elite Engines (exclusive to AEGIS-Elite)
# ─────────────────────────────────────────────────────
elite:
  governance:
    module: AEGIS-Governance
    entry: policy_engine.py
    description: >
      5-layer governance engine: Architecture Guard → Security Scanner →
      Maintainability → Performance Guard → Compliance Validator.
      Weighted scoring. Critical violations block all commits.
    capabilities: [audit, scan, enforce, score, report]
    layers:
      - {name: Architecture Guard,   weight: 0.30, veto: true}
      - {name: Security Scanner,     weight: 0.30, veto: true}
      - {name: Maintainability,      weight: 0.20, veto: false}
      - {name: Performance Guard,    weight: 0.10, veto: false}
      - {name: Compliance Validator, weight: 0.10, veto: false}
    status: active

  consensus:
    module: AEGIS-Consensus
    entry: voting_engine.py
    description: >
      5-agent AI Council: Programmer → Reviewer → Architect* → Security* → Performance.
      (* = VETO power). Required: 4/5 approvals + no hard vetoes.
    capabilities: [vote, resolve, approve, veto, debate]
    agents:
      - {name: Programmer Agent,   weight: 1.0, veto: false}
      - {name: Reviewer Agent,     weight: 1.0, veto: false}
      - {name: Architect Agent,    weight: 1.5, veto: true}
      - {name: Security Agent,     weight: 2.0, veto: true}
      - {name: Performance Agent,  weight: 1.0, veto: false}
    threshold: 0.80
    required_approvals: 4
    status: active

  memory:
    module: AEGIS-Memory
    entry: memory_engine.py
    description: >
      4-subsystem cognitive memory: ProjectMemory (topology diff) →
      DecisionHistory (ADR ledger) → LearningLoop (adaptive governance) →
      CognitiveSummary (cross-session intelligence).
    capabilities: [snapshot, record_adr, learn, summarize, recommend]
    status: active

  risk:
    module: AEGIS-Risk
    entry: risk_assessor.py
    description: >
      Pre-change blast-radius analysis. Scores risk before any change is
      applied. Integrates with Consensus to auto-escalate high-risk changes.
    capabilities: [assess, predict, blast_radius, block, escalate]
    status: active

  benchmark:
    module: AEGIS-Benchmark
    entry: runner.py
    description: >
      Verifiable benchmark suite comparing AEGIS Elite vs baseline AI tools
      across 6 dimensions: bug rate, test coverage, debug time, architecture
      compliance, security, and feature velocity.
    capabilities: [run, score, compare, report]
    metrics:
      - {name: Bug Rate,                 improvement: "72% reduction"}
      - {name: Test Coverage,            improvement: "+21 percentage points"}
      - {name: Debug Time,               improvement: "66% faster"}
      - {name: Architecture Compliance,  improvement: "+33 percentage points"}
      - {name: Security Vulnerability,   improvement: "88% safer"}
      - {name: Feature Delivery Speed,   improvement: "2.3× faster"}
    status: active

  analytics:
    module: AEGIS-Analytics
    entry: analytics.py
    description: Telemetry, usage analytics, and engineering health monitoring
    capabilities: [track, report, alert, dashboard]
    status: active

  enterprise:
    module: AEGIS-Enterprise
    entry: compliance.py
    description: >
      Enterprise compliance: SOC2, GDPR, audit trails, role-based access,
      SSO integration, and SLA management.
    capabilities: [soc2, gdpr, audit_trail, rbac, sso, sla]
    status: active

# ─────────────────────────────────────────────────────
#  Platform Services
# ─────────────────────────────────────────────────────
platform:
  workflow:
    module: AEGIS-Orchestrator
    entry: workflow_engine.py
    description: >
      End-to-end pipeline orchestrator: Risk → Governance → Consensus → Memory.
      Long workflows, multi-step decision pipelines, automated rollback.
    capabilities: [pipeline, orchestrate, rollback, checkpoint]
    status: active

  extension_marketplace:
    module: AEGIS-Extension
    entry: plugin_manager.py
    description: Domain pack marketplace — install, update, remove packs
    capabilities: [install, list, remove, update]
    packs:
      - {id: react-pack,          domain: Frontend,     version: "1.0.0", status: available}
      - {id: flutter-pack,        domain: Mobile,       version: "1.0.0", status: available}
      - {id: laravel-pack,        domain: Backend,      version: "1.0.0", status: available}
      - {id: rust-pack,           domain: Systems,      version: "1.0.0", status: available}
      - {id: cybersecurity-pack,  domain: Security,     version: "1.0.0", status: available}
      - {id: data-pack,           domain: ML/Data,      version: "1.0.0", status: available}
      - {id: python-pack,         domain: Python/API,   version: "1.0.0", status: available}
    status: active

  git_hooks:
    module: AEGIS-Kernel
    entry: git_hooks.py
    description: >
      Install AEGIS as a git pre-commit hook. Every commit automatically
      passes through Governance → Consensus before being allowed.
    capabilities: [pre_commit, post_commit, install, uninstall]
    status: active

# ─────────────────────────────────────────────────────
#  External Tool Integrations
# ─────────────────────────────────────────────────────
external_tools:
  - id: claude-code
    description: Anthropic Claude Code CLI
    install: "npm install -g @anthropic-ai/claude-code"
    check_cmd: "claude --version"
    integration: AEGIS-Compiler
    status: active

  - id: n8n
    description: Node-based workflow automation engine
    install: "npm install -g n8n --ignore-scripts"
    check_cmd: "n8n --version"
    integration: AEGIS-Orchestrator
    status: active

  - id: praisonai
    description: Multi-agent framework for Consensus Engine
    install: "pip install praisonai --prefer-binary"
    check_cmd: "praisonai --version"
    integration: AEGIS-Consensus
    status: active

  - id: firecrawl-py
    description: Web scraping & docs ingestion for Knowledge Engine
    install: "pip install firecrawl-py"
    check_cmd: "python -c \"import firecrawl\""
    integration: AEGIS-Knowledge
    status: active

# ─────────────────────────────────────────────────────
#  Knowledge Packs
# ─────────────────────────────────────────────────────
knowledge_packs:
  path: AEGIS-Knowledge/Packs
  categories:
    - {name: Architectures, description: Agent architecture patterns, status: active}
    - {name: Skills,        description: Tools and capability modules, status: active}
    - {name: Tools,         description: External tooling integrations, status: active}
    - {name: Prompts,       description: Master system prompts, status: active}
    - {name: Governance,    description: Policy rules and compliance templates, status: active}

# ─────────────────────────────────────────────────────
#  Elite vs Core Feature Matrix (for documentation)
# ─────────────────────────────────────────────────────
feature_matrix:
  shared_with_core:
    - Cognitive Runtime (AEGIS Pipeline)
    - Model Router (active)
    - Capability Graph
    - CLI Core (aegis new / plan / run / status / doctor)
    - SDK Contract
    - Compiler Pipeline
    - Basic governance (1-layer)

  elite_exclusive:
    - 5-Layer Governance Engine (Architecture + Security + Maintainability + Performance + Compliance)
    - 5-Agent Consensus Council with hard vetoes
    - Adaptive LearningLoop (governance tightens from repeated failures)
    - Cognitive Memory (cross-session intelligence, ADR ledger, topology diff)
    - Risk Assessor (blast-radius analysis before any change)
    - Verifiable Benchmark Suite (6 metrics vs industry baseline)
    - Extension Marketplace (7 domain packs)
    - Enterprise Compliance (SOC2, GDPR, audit trail, RBAC, SSO)
    - Git Pre-commit Hook Integration
    - Governance Score Card (live, per-layer)
    - AEGIS Studio (visual dashboard)
    - Execution Modes (Quick / Balanced / Enterprise)
    - Multi-step workflow pipelines with rollback
